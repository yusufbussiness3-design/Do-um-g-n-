<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İyi Ki Doğdun!</title>
  
  <!-- Canvas Confetti Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #d63384;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #555;
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    /* Dijital Pasta Tasarımı */
    .cake-container {
      position: relative;
      width: 150px;
      height: 120px;
      margin: 0 auto 30px auto;
      cursor: pointer;
    }

    .cake {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 80px;
      background: #f48fb1;
      border-radius: 10px 10px 0 0;
      box-shadow: inset 0 12px 0 #ec407a;
    }

    .cake::before {
      content: '';
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40px;
      background: #f8bbd0;
      border-radius: 10px 10px 0 0;
    }

    /* Mumu Yakan Alev */
    .candle {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 35px;
      background: #fff;
      border-radius: 3px;
      background: repeating-linear-gradient(45deg, #ff80ab, #ff80ab 5px, #fff 5px, #fff 10px);
    }

    .flame {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 20px;
      background: #ff9800;
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 10px #ff9800, 0 0 20px #ffeb3b;
      animation: flicker 0.6s infinite alternate;
      transition: opacity 0.5s ease;
    }

    .flame.off {
      opacity: 0;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.15); }
    }

    /* Mesaj Alanı */
    .message-box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid #d63384;
      font-size: 0.95rem;
      color: #444;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* Buton */
    .btn {
      background: #d63384;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #c2185b;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>İyi Ki Doğdun! 🎉</h1>
    <p class="subtitle">Yeni yaşın sana sağlık, mutluluk ve başarı getirsin!</p>

    <!-- İnteraktif Pasta -->
    <div class="cake-container" onclick="blowCandle()">
      <div class="candle">
        <div class="flame" id="flame"></div>
      </div>
      <div class="cake"></div>
    </div>

    <!-- Özel Mesaj -->
    <div class="message-box">
      <p id="instruction">💡 <strong>İpucu:</strong> Dilek tut ve muma tıkla!</p>
    </div>

    <!-- Konfeti Butonu -->
    <button class="btn" onclick="fireConfetti()">Tebrik Et 🥳</button>
  </div>

  <script>
    // Sayfa yüklendiğinde otomatik konfeti patlat
    window.addEventListener('DOMContentLoaded', () => {
      fireConfetti();
    });

    // Konfeti Efekti
    function fireConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // Mum Üfleme/Söndürme Fonksiyonu
    let candleLit = true;
    function blowCandle() {
      if (candleLit) {
        document.getElementById('flame').classList.add('off');
        document.getElementById('instruction').innerHTML = '✨ <strong>Dileğin kabul olsun!</strong> 🎈';
        
        // Mum sönünce güçlü konfeti
        confetti({
          particleCount: 200,
          spread: 100,
          origin: { y: 0.5 }
        });

        candleLit = false;
      }
    }
  </script>
</body>
</html>
